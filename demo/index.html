<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse the current MarkupUI examples, one component per page.">
  <title>Components - MarkupUI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="component-app">
    <header class="site-header">
      <button type="button" id="navigation-toggle" class="navigation-toggle"
        aria-controls="component-sidebar" aria-expanded="false" hidden>Components</button>
      <a class="brand" href="./"><span class="brand-icon" aria-hidden="true">M</span>MarkupUI</a>
      <span class="header-caption">Components</span>
      <a class="repository-link" href="https://github.com/BunnySoft/MarkupUI"
        target="_blank" rel="noopener noreferrer">GitHub</a>
    </header>
    <div class="browser-layout">
      <aside id="component-sidebar" class="component-sidebar">
        <div class="search-box">
          <label class="visually-hidden" for="component-search">Search components</label>
          <input type="search" id="component-search" placeholder="Search components"
            autocomplete="off" aria-controls="component-navigation">
        </div>
        <nav id="component-navigation" aria-label="Components"></nav>
        <p id="no-results" class="no-results" hidden>No matching components.</p>
        <p id="component-count" class="component-count" role="status"></p>
      </aside>
      <main id="component-workspace" class="component-workspace">
        <header class="component-toolbar">
          <div>
            <p id="component-category" class="component-category">Components</p>
            <h1 id="component-title" tabindex="-1">Choose a component</h1>
          </div>
          <a id="standalone-link" class="standalone-link" target="_blank"
            rel="noopener noreferrer" hidden>Open standalone ↗</a>
        </header>
        <p id="component-note" class="component-note">
          Each page loads only its own examples and assets.
        </p>
        <p id="page-status" class="page-status" role="status">Loading component navigation...</p>
        <iframe id="component-frame" title="Component examples" hidden allowfullscreen></iframe>
        <noscript>
          <p class="page-status">Enable JavaScript to browse the component navigation, or open a
            standalone example directly: <a href="./components/avatar.html">Avatar</a>,
            <a href="./components/button.html">Button</a>, <a href="./components/card.html">Card</a>.</p>
        </noscript>
      </main>
    </div>
  </div>
</body>
</html>
