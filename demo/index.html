<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse the current MarkupUI examples, one component per page.">
  <title>Components - MarkupUI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../dist/markup-ui-button.css">
  <link rel="stylesheet" href="../dist/markup-ui-input.css">
  <link rel="stylesheet" href="../dist/markup-ui-themes.css">
  <link rel="stylesheet" href="../dist/markup-ui-theme-slate.css">
  <link rel="stylesheet" href="./app.css">
  <script defer src="../dist/markup-ui-core.global.js"></script>
  <script defer src="../dist/markup-ui-button.global.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="component-app">
    <header class="site-header">
      <m-button id="navigation-toggle" class="navigation-toggle" size="small" appearance="secondary"
        aria-controls="component-sidebar" aria-expanded="false" hidden>
        <button type="button" aria-controls="component-sidebar"
          aria-expanded="false">Components</button>
      </m-button>
      <a class="brand" href="./"><span class="brand-icon" aria-hidden="true">M</span>MarkupUI</a>
      <span class="header-caption">Components</span>
      <div class="header-actions">
        <label for="theme-select" class="visually-hidden">Theme</label>
        <select id="theme-select" class="theme-select" aria-label="Theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="slate">Slate</option>
          <option value="slate-dark">Slate Dark</option>
        </select>
        <a class="standalone-link" href="./elements.html" target="_blank"
          rel="noopener noreferrer" aria-label="Element Matrix" title="Element Matrix">
          <span class="standalone-label">Element Matrix</span><span aria-hidden="true">↗</span>
        </a>
        <a id="standalone-link" class="standalone-link" target="_blank"
          rel="noopener noreferrer" aria-label="Open standalone" title="Open standalone" hidden>
          <span class="standalone-label">Open standalone</span><span aria-hidden="true">↗</span>
        </a>
        <a class="repository-link" href="https://github.com/BunnySoft/MarkupUI"
          target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </header>
    <div class="browser-layout">
      <aside id="component-sidebar" class="component-sidebar">
        <div class="search-box">
          <label class="visually-hidden" for="component-search">Search components</label>
          <div class="m-input" data-size="small">
            <input data-input-control type="search" id="component-search"
              placeholder="Search components" autocomplete="off"
              aria-controls="component-navigation">
          </div>
        </div>
        <nav id="component-navigation" aria-label="Components"></nav>
        <p id="no-results" class="no-results" hidden>No matching components.</p>
        <p id="component-count" class="component-count" role="status"></p>
      </aside>
      <main id="component-workspace" class="component-workspace">
        <p id="component-note" class="component-note">
          Each page loads only its own examples and assets.
        </p>
        <p id="page-status" class="page-status" role="status">Loading component navigation...</p>
        <iframe id="component-frame" title="Component examples" hidden allowfullscreen></iframe>
        <noscript>
          <p class="page-status">Enable JavaScript to browse the component navigation, or open a
            standalone example directly: <a href="./components/avatar.html">Avatar</a>,
            <a href="./components/button.html">Button</a>, <a href="./components/card.html">Card</a>.</p>
        </noscript>
      </main>
    </div>
  </div>
</body>
</html>
