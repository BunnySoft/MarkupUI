<m-loading-bar id="site-loading" status="none"></m-loading-bar>
<m-drawer id="mobile-nav" title="Fieldnotes" placement="left" closable>
  <m-box id="mobile-navigation"></m-box>
</m-drawer>
<m-drawer id="notifications" title="Your inbox" placement="right" closable>
  <m-p class="muted">A few good things from the sample workspace.</m-p>
  <m-notification type="success" title="Welcome to Fieldnotes"
    description="Your local workspace is ready."
    content="Explore six pages built entirely with MarkupUI."></m-notification>
  <m-notification type="info" title="Everything stays here"
    description="No account or backend required."
    content="Project and preference changes are stored only in this browser."></m-notification>
  <m-button id="read-notifications" appearance="secondary">All caught up</m-button>
</m-drawer>
<m-box id="toast-region" role="status" aria-live="polite"></m-box>
<m-back-top bottom="24" right="24"></m-back-top>
