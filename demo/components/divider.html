<!doctype html>
<html lang="en" data-mui-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarkupUI Divider parity demos</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../dist/markup-ui-global-style.css">
  <link rel="stylesheet" href="../../dist/markup-ui-themes.css">
  <link rel="stylesheet" href="../../dist/markup-ui-divider.css">
  <link rel="stylesheet" href="../../dist/markup-ui-button.css">
  <link rel="stylesheet" href="../../dist/markup-ui-code.css">
  <link rel="stylesheet" href="../example-code.css">
  <link rel="stylesheet" href="./divider.css">
  <script defer src="../../dist/markup-ui-button.global.js"></script>
  <script type="module" src="../example-code.js"></script>
</head>
<body>
  <main data-demo-page>
    <h1>Divider</h1>
    <p>MarkupUI equivalents of the three Divider demos from pinned Naive UI 2.45.3,
      in the same order and using native separator semantics.</p>

    <section data-demo-example="basic" aria-labelledby="basic-heading">
      <header data-demo-header><div><h2 id="basic-heading">Basic</h2></div></header>
      <div class="demo-preview vertical" data-demo-preview>
        <span>Oops</span>
        <hr class="mui-divider">
        <span>Oops</span>
      </div>
    </section>

    <section data-demo-example="content" aria-labelledby="content-heading">
      <header data-demo-header><div><h2 id="content-heading">Title</h2></div></header>
      <div class="demo-preview vertical" data-demo-preview>
        <span>Oops</span>
        <div class="mui-divider mui-divider-captioned" data-placement="left"
          role="separator" aria-labelledby="left-divider-label">
          <span class="mui-divider-label" id="left-divider-label" aria-hidden="true">Left</span>
        </div>
        <span>Oops</span>
        <div class="mui-divider mui-divider-captioned" data-placement="right"
          role="separator" aria-labelledby="right-divider-label">
          <span class="mui-divider-label" id="right-divider-label" aria-hidden="true">Right</span>
        </div>
        <span>Oops</span>
        <div class="mui-divider mui-divider-captioned" data-dashed
          role="separator" aria-labelledby="dashed-divider-label">
          <span class="mui-divider-label" id="dashed-divider-label" aria-hidden="true">Dashed</span>
        </div>
        <span>Oops</span>
      </div>
    </section>

    <section data-demo-example="vertical" aria-labelledby="vertical-heading">
      <header data-demo-header><div><h2 id="vertical-heading">Vertical</h2></div></header>
      <div class="demo-preview inline" data-demo-preview>
        <span>It is</span>
        <span class="mui-divider" data-orientation="vertical" aria-hidden="true"></span>
        <span>not clear</span>
        <span class="mui-divider" data-orientation="vertical" aria-hidden="true"></span>
        <span>to see, emmm...</span>
      </div>
    </section>
  </main>
</body>
</html>
