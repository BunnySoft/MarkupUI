name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.12.0", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build and report size recommendations
        run: node scripts/build.mjs

      - name: Full test suite
        run: node node_modules/vitest/vitest.mjs run --maxWorkers=2 --reporter=json --outputFile=.vite/ci-tests.json

      - name: Isolated packed consumer
        run: node scripts/package-check.mjs

      - name: Upload test and consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            .vite/ci-tests.json
            .vite/package/results.json
          include-hidden-files: true
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.mjs
      - name: Install browser engines and system libraries
        run: node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Three-engine desktop and mobile-layout acceptance
        run: node scripts/browser-check.mjs --catalog
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: .vite/browser
          include-hidden-files: true
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit all locked dependencies
        run: pnpm audit --json
